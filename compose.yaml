name: nexus-local

services:
  app:
    image: nexus-local:dev
    build:
      context: .
      target: development
    init: true
    env_file:
      - .docker/app.env
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/auth').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
